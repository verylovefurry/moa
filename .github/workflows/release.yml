name: Windows release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Check release version
        run: python -c "import os; from version import APP_VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v' + APP_VERSION, 'Tag and APP_VERSION differ'"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -q
      - run: python build_desktop.py
      - run: python tools/verify_packaged_updater.py
      - name: Publish executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py
